<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تألقي بأناقتك | أحذية وحقائب نسائية</title>
    <!-- استيراد خط عربي أنيق من جوجل -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
    <!-- استيراد أيقونات FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Tajawal', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #fcf6f5 0%, #f4e8e6 100%);
            color: #2c2c2c;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .linktree-container {
            width: 100%;
            max-width: 450px;
            background: #ffffff;
            border-radius: 30px;
            box-shadow: 0 15px 35px rgba(184, 134, 11, 0.08);
            overflow: hidden;
            position: relative;
            border: 1px solid rgba(212, 175, 55, 0.2);
        }

        /* خلفية جمالية مدمجة بالصور والألوان في الهيدر */
        .header-bg {
            position: relative;
            height: 220px;
            background: url('https://images.unsplash.com/photo-1543163521-1bf539c55dd2?q=80&w=600&auto=format&fit=crop') center/cover no-repeat;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            padding-bottom: 20px;
        }

        .header-bg::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, rgba(0,0,0,0.2), rgba(44,44,44,0.7));
        }

        .profile-content {
            position: relative;
            z-index: 2;
            text-align: center;
            color: #fff;
        }

        .logo-container {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            border: 3px solid #fff;
            overflow: hidden;
            margin: 0 auto 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            background: #fff;
        }

        .logo-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .store-title {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 3px;
            letter-spacing: 0.5px;
        }

        .store-subtitle {
            font-size: 0.85rem;
            color: #f0f0f0;
            font-weight: 400;
        }

        /* قسم الروابط والأزرار */
        .links-section {
            padding: 30px 25px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            background: #fff;
        }

        .link-btn {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #faf7f5;
            border: 1px solid #ebd9d3;
            padding: 14px 20px;
            border-radius: 16px;
            text-decoration: none;
            color: #333;
            font-weight: 600;
            font-size: 1rem;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.02);
            position: relative;
            overflow: hidden;
        }

        .link-btn:hover {
            transform: translateY(-3px);
            background: #fff;
            border-color: #c59b92;
            box-shadow: 0 8px 15px rgba(197, 155, 146, 0.15);
            color: #8c584e;
        }

        .link-btn i.icon-left {
            font-size: 1.2rem;
            color: #8c584e;
            transition: transform 0.3s;
        }

        .link-btn:hover i.icon-left {
            transform: scale(1.1);
        }

        .link-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .link-info i {
            font-size: 1.3rem;
            width: 35px;
            text-align: center;
        }

        /* تخصيص ألوان الأيقونات لكل زر */
        .whatsapp i { color: #25D366; }
        .instagram i { color: #E1306C; }
        .tiktok i { color: #000000; }
        .map i { color: #EA4335; }

        .arrow-icon {
            font-size: 0.9rem;
            color: #aaa;
        }

        /* تذييل الصفحة */
        .footer {
            text-align: center;
            padding: 15px;
            font-size: 0.75rem;
            color: #888;
            background: #faf7f5;
            border-top: 1px solid #f0e6e4;
        }
    </style>
</head>
<body>

    <div class="linktree-container">
        <!-- الهيدر مع صورة خلفية حقيقية وأنيقة للأحذية/الحقائب -->
        <div class="header-bg">
            <div class="profile-content">
                <div class="logo-container">
                    <!-- صورة مصغرة محتشمة ومعبرة للمحل -->
                    <img src="https://images.unsplash.com/photo-1584917865442-de89df76afd3?q=80&w=300&auto=format&fit=crop" alt="شعار المحل">
                </div>
                <h1 class="store-title">أناقة الأنثى العصرية</h1>
                <p class="store-subtitle">أرقى تصاميم الأحذية والحقائب النسائية 👠👜</p>
            </div>
        </div>

        <!-- الأزرار والروابط المطلوبة -->
        <div class="links-section">
            
            <!-- زر الواتساب -->
            <a href="https://wa.me/qr/7A2NNDDNCLEYF1" target="_blank" class="link-btn whatsapp">
                <div class="link-info">
                    <i class="fab fa-whatsapp"></i>
                    <span>تواصل معنا عبر الواتساب</span>
                </div>
                <i class="fas fa-chevron-left arrow-icon"></i>
            </a>

            <!-- زر إنستغرام -->
            <a href="https://www.instagram.com/tryqshwb?cplk=NWJkd3diNnNxaDM5" target="_blank" class="link-btn instagram">
                <div class="link-info">
                    <i class="fab fa-instagram"></i>
                    <span>تابعنا على إنستغرام</span>
                </div>
                <i class="fas fa-chevron-left arrow-icon"></i>
            </a>

            <!-- زر تيك توك -->
            <a href="https://www.tiktok.com/@tarikshop286?_r=1&_t=ZS-9BCmQ7dA2Py" target="_blank" class="link-btn tiktok">
                <div class="link-info">
                    <i class="fab fa-tiktok"></i>
                    <span>شاهد أحدث التشكيلات في تيك توك</span>
                </div>
                <i class="fas fa-chevron-left arrow-icon"></i>
            </a>

            <!-- زر خريطة جوجل -->
            <a href="https://goo.gl/maps/zm5h8gCifnfz4fDv9" target="_blank" class="link-btn map">
                <div class="link-info">
                    <i class="fas fa-map-marker-alt"></i>
                    <span>موقعنا على خريطة جوجل</span>
                </div>
                <i class="fas fa-chevron-left arrow-icon"></i>
            </a>

        </div>

        <!-- التذييل -->
        <div class="footer">
            جميع الحقوق محفوظة &copy; 2026
        </div>
    </div>

</body>
</html>
